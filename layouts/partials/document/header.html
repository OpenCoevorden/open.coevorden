{{/*
    document/header.html — paginakop met terug-knop en de enige <h1>.
    Context: de Page zelf (.).
*/}}
<header class="doc-header" role="banner">
    <a href="{{ "/index.html" | relURL }}"><img src="https://www.coevorden.nl/images/logo287e353daeeb0e59.svg" alt="Gemeente Coevorden logo" width="225" height="79"></a>
    <nav class="header-nav" aria-label="Paginanavigatie">
        {{/* WCAG 2.4.4 + 2.5.5: beschrijvende linktekst, 44px-doel (CSS). */}}
        <a href="{{ .Site.Params.indexURL }}" class="btn-back" id="back-button">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            <span>Terug naar overzicht</span>
        </a>
    </nav>
    {{/* WCAG 1.3.1: enige h1 op de pagina */}}
    <h1>{{ .Title }}</h1>
</header>
