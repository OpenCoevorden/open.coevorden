# =============================================================================
#  HUGO CONFIGURATIE  —  PDF Zoekmachine / Publicaties Coevorden
# -----------------------------------------------------------------------------
#  ALLE site-brede én template-instelbare waarden staan hier centraal.
#  single.html en de partials lezen deze via `.Site.Params` — niets meer
#  hardcoden in de templates.
#
#  LET OP: index.html wordt NIET door Hugo gebouwd (aparte deploy via
#  index.yml) en heeft daarom een eigen kopie van o.a. de kleuren. Houd die
#  in sync met [params.theme] hieronder.
#
#  AFHANKELIJKHEDEN / EXTERNE DIENSTEN
#    • CloudFront-distributie → levert baseURL / s3_url / indexURL.
#    • Cloudflare Worker      → AI-backend (params.chat.workerURL).
#    • Geen extern Hugo-thema  → eigen templates (baseof + partials).
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
#  KERN-INSTELLINGEN
# ─────────────────────────────────────────────────────────────────────────────

# baseURL — CloudFront-root. Moet op "/" eindigen. GEEN map-prefix opnemen:
#   content staat genest, dus Hugo zet de prefix zelf in elke permalink.
baseURL = 'https://open.coevorden.nl/'

# locale — taal/regio voor datum-/getalnotatie.
locale = "nl-nl"

# languageCode — gebruikt in <html lang="…"> (baseof.html).
languageCode = "nl"

# title — sitetitel (RSS/metadata).
title = 'PDF Zoekmachine'

# theme — LEEG: eigen templates.
theme = []

# uglyURLs — losse .html-bestanden i.p.v. mappen met index.html (nodig voor S3).
uglyURLs = true


# ─────────────────────────────────────────────────────────────────────────────
#  PARAMS  —  beschikbaar in templates via `.Site.Params.<naam>`
# ─────────────────────────────────────────────────────────────────────────────
[params]
  # s3_url — basis waarmee single.html de PDF-downloadlink opbouwt.
  #   Gelijk houden aan baseURL (CloudFront-root).
  s3_url = "https://open.coevorden.nl/"

  # indexURL — doel van de "Terug naar overzicht"-knop.
  indexURL = 'https://open.coevorden.nl/index.html'


# ── THEMA / KLEUREN ──────────────────────────────────────────────────────────
#   Geïnjecteerd als CSS-variabelen in partials/styles.html.
#   WCAG: primary/accent gekozen op ≥4.5:1 contrast met wit.
[params.theme]
  primary = "#4a2060"
  accent  = "#669900"
  bg      = "#669900"


# ── MAP-STRUCTUUR PER ONDERWERP ──────────────────────────────────────────────
#   Per onderwerp (= de bovenste contentmap / .Section) een GEORDENDE lijst van
#   niveaus. De VOLGORDE van de regels = de padvolgorde onder het onderwerp.
#   Positie 0 in het pad is altijd het onderwerp zelf; de eerste [[...]]-regel
#   hoort dus bij het EERSTE submapniveau daaronder.
#
#   Velden per niveau:
#     key      — interne naam (uniek binnen het onderwerp)
#     label    — zichtbaar label ÉN de Pagefind-filternaam
#                (neem exact dezelfde labels op in `filters` in index.html)
#     icon     — Bootstrap-icoon (optioneel; default "bi-folder")
#     group    — (optioneel) markeer het niveau waarop "gerelateerde documenten"
#                gegroepeerd worden (voor woo = zaak). Max. één per onderwerp.
#     optional — (optioneel) mag ontbreken bij sommige documenten
#
#   Een nieuw onderwerp toevoegen = een nieuw [[params.structuur.<naam>]]-blok.
#   De niveaus herorden = de regels herorden. Geen indexnummers meer.

# woo-publicaties / <jaar> / <categorie> / <zaak?>   (structuur ongewijzigd)
[[params.structuur.woo-publicaties]]
  key = "jaar"
  label = "Jaar"
  icon = "bi-calendar3"
[[params.structuur.woo-publicaties]]
  key = "categorie"
  label = "Categorie"
  icon = "bi-tag"
[[params.structuur.woo-publicaties]]
  key = "zaak"
  label = "Zaak"
  icon = "bi-folder"
  group = true
  optional = true

# vergunningen / <categorie> / <jaar>
[[params.structuur.vergunningen]]
  key = "categorie"
  label = "Categorie"
  icon = "bi-tag"
  group = true
[[params.structuur.vergunningen]]
  key = "jaar"
  label = "Jaar"
  icon = "bi-calendar3"

# riool-tekeningen / plaats
[[params.structuur.riool-tekeningen]]
  key = "plaats"
  label = "plaats"
  icon = "bi-map"

# Fallback voor onderwerpen zonder eigen blok hierboven.
[[params.structuur.default]]
  key = "jaar"
  label = "Jaar"
  icon = "bi-calendar3"
[[params.structuur.default]]
  key = "categorie"
  label = "Categorie"
  icon = "bi-tag"
[[params.structuur.default]]
  key = "zaak"
  label = "Zaak"
  icon = "bi-folder"
  group = true
  optional = true


# ── AI-CHAT (client-side, single.html) ───────────────────────────────────────
#   Geïnjecteerd in partials/document/chat-script.html.
[params.chat]
  # Adres van de Cloudflare Worker die (server-side) OpenAI aanroept.
  workerURL        = "https://opencoevorden.informatiemanagement.workers.dev/"
  # Time-out (ms) voor de Worker-call; daarna afgebroken.
  requestTimeoutMs = 20000
  # Begroeting die als eerste in de chat verschijnt.
  startMessage     = "Stel hier met AI een vraag over bovenstaand document."
  # Past de documenttekst hieronder (tekens)? Dan volledig meesturen.
  fullLimit        = 150000
  # Te lang? Tekenbudget voor de opgehaalde (BM25-)stukken.
  retrieveBudget   = 40000
  # Begin van het document dat altijd wordt meegestuurd (tekens).
  introChars       = 3000
  # BM25-parameters: verzadiging van herhaling / lengte-normalisatie.
  bm25K1           = 1.5
  bm25B            = 0.75


# ─────────────────────────────────────────────────────────────────────────────
#  OUTPUT-FORMATEN
# ─────────────────────────────────────────────────────────────────────────────
[outputs]
  home = ["HTML", "RSS", "JSON"]


# ─────────────────────────────────────────────────────────────────────────────
#  MINIFY
# ─────────────────────────────────────────────────────────────────────────────
[minify]
  disableXML = true   # RSS/sitemap niet minificeren


# ─────────────────────────────────────────────────────────────────────────────
#  SITEMAP
# ─────────────────────────────────────────────────────────────────────────────
[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"
