# =============================================================================
# bouwtekeningen deploy.yml — GitHub Actions: S3 → Hugo → Pagefind → S3 deploy
# =============================================================================
#
# WAT DOET DEZE WORKFLOW?
#   1) Spiegelt de PDF's uit de bron-bucket naar markdown (met tekst + frontmatter).
#      Heeft een PDF geen (bruikbare) tekstlaag, dan wordt de pagina gerasterd en
#      in meerdere leesrichtingen ge-OCR'd.
#   2) Bouwt de Hugo-site.
#   3) Indexeert met Pagefind.
#   4) Synct het resultaat naar de site-bucket (scoped op SYNC_FOLDER).
#   Draait bij push op main, elke nacht (cron) en handmatig (workflow_dispatch).
#
# -----------------------------------------------------------------------------
# WAAROM DE OCR-STAP IS HERSCHREVEN (t.o.v. de ocrmypdf-versie)
# -----------------------------------------------------------------------------
#   Bouwtekeningen zijn geen gewone documenten. Twee dingen gingen mis:
#
#   1) ocrmypdf --skip-text sloeg juist de pagina's over die OCR nodig hadden.
#      Een CAD-export heeft vaak een titelblok als ECHTE tekst (TTF) terwijl de
#      annotaties in de tekening met SHX-fonts zijn geplot en dus vectoren zijn.
#      De pagina "heeft tekst" → --skip-text slaat 'm over → de OCR-stap kostte
#      runner-tijd en leverde exact dezelfde magere output op.
#
#   2) Eén OCR-pass leest maar één richting. Maatvoering, doorsnede-labels en
#      zij-annotaties staan 90° gedraaid; die kwamen er als niets of als onzin
#      uit. --rotate-pages helpt niet: dat draait de HELE pagina naar de
#      dominante richting en verplaatst het probleem alleen.
#
#   Omdat we de OCR-PDF toch weggooien (we willen alleen de tekst), slaan we
#   ocrmypdf helemaal over: zelf rasteren met pdftoppm, de pagina met qpdf in
#   een paar richtingen draaien en tesseract er per richting overheen halen.
#   Dat is direct te tunen via de env-variabelen hieronder.
#
#   DIAGNOSE bij twijfel — draai dit lokaal op een probleemtekening:
#     pdffonts  tekening.pdf          # fonts? → er IS een tekstlaag
#     pdftotext -raw   tekening.pdf - # wat haalt poppler eruit?
#     pdftotext -layout tekening.pdf -
#   Levert pdftotext wél nette tekst op, dan is het geen OCR-probleem maar een
#   extractie-probleem; zie PDFTOTEXT_MODE hieronder.
#
# -----------------------------------------------------------------------------
# EXTERNE ACTIONS / TOOLS (updaten = versie/pin hieronder in de steps aanpassen)
# -----------------------------------------------------------------------------
#   actions/checkout@v7                     → repo uitchecken.
#   stefanzweifel/git-auto-commit-action@v7 → de gesyncte markdown terugcommitten.
#   peaceiris/actions-hugo@v3               → Hugo installeren (versie gepind).
#   poppler-utils (pdftotext, pdfinfo,      → PDF→tekst, paginatelling, rasteren.
#                  pdftoppm, pdffonts)
#   qpdf                                    → pagina's roteren vóór het rasteren.
#   tesseract-ocr + tesseract-ocr-nld       → de OCR zelf (nld+eng).
#   AWS CLI                                 → voorgeïnstalleerd op de runner.
#   npx pagefind                            → zoekindex bouwen (gepind via env).
#
#   LET OP — de apt-packages zijn NIET door Renovate te beheren; er bestaat geen
#   manager voor 'apt-get install'-regels. Hun versie komt van de Ubuntu-release
#   achter 'ubuntu-latest'. Wil je die verandering zelf in de hand houden, pin
#   dan 'runs-on: ubuntu-24.04'.
#
# SECRETS (Repo → Settings → Secrets and variables → Actions)
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY            → LEEST bron-bucket.
#   AWS_ACCESS_KEY_ID_SITE / AWS_SECRET_ACCESS_KEY_SITE  → SCHRIJFT site-bucket.
#
# LET OP — KOSTEN/DUUR VAN OCR
#   De ETag-check in process_file zorgt dat elk PDF maar één keer wordt verwerkt;
#   het resultaat wordt als markdown teruggecommit. OCR draait dus eenmalig per
#   document, niet elke nacht opnieuw. Reken bij grootformaat tekeningen (A1/A0)
#   op enkele minuten per bestand voor de eerste run.
#
# BESTAANDE BESTANDEN — HERPAKKEN NA DEZE WIJZIGING
#   Al gesyncte .md-bestanden hebben een matchende ETag en worden overgeslagen,
#   ook als ze (bijna) leeg zijn. Verwijder de magere bestanden om ze alsnog
#   door de nieuwe OCR-route te halen:
#     find onderwerpen/bouwtekeningen -name '*.md' -exec sh -c \
#       'c=$(sed "1,/^---$/d;1,/^---$/d" "$1" | tr -d "[:space:]" | wc -c); \
#        [ "$c" -lt 300 ] && rm "$1"' _ {} \;
# =============================================================================

name: Bouwtekeningen deploy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  # ── PAS HIER HET ONDERWERP (+ eventueel JAAR) AAN ──────────────
  # Vorm: "<onderwerp>" of "<onderwerp>/<jaar>". Moet EXACT (incl. casing) als
  # prefix bestaan in de bron-bucket; de site-bucket wordt hiervan de spiegel.
  SYNC_FOLDER: "bouwtekeningen"

  # Beide buckets staan in eu-north-1 (zie origin-domeinen in CloudFront).
  AWS_DEFAULT_REGION: eu-north-1

  # De site wordt via CloudFront geserveerd, niet via de rauwe (privé/OAC) S3-URL.
  # baseURL blijft de CloudFront-ROOT: door de geneste content zet Hugo de
  # prefix zelf al in elke permalink.
  CDN_BASE_URL: "https://d3jow2udcm31b0.cloudfront.net"

  # ── TEKSTEXTRACTIE ─────────────────────────────────────────────
  # Modus voor pdftotext op de bestaande tekstlaag:
  #   raw    → tekst in de volgorde waarin hij in het PDF staat (was de default)
  #   layout → behoudt de ruimtelijke kolom-/blokindeling
  #   ""     → poppler's eigen leesvolgorde-heuristiek
  # Bij CAD-exports waar woorden uit elkaar vallen ("B O U W") is het de moeite
  # om 'layout' te proberen; dat houdt bij elkaar geplaatste glyphs vaker samen.
  PDFTOTEXT_MODE: "raw"

  # ── OCR ────────────────────────────────────────────────────────
  # Minder dan zoveel tekens tekst per pagina → we beschouwen het als een scan
  # of een vector-geplotte tekening en halen er OCR overheen. Voor bouwtekeningen
  # bewust hoger dan de 100 van de woo-workflow: een tekening met alleen een
  # titelblok als echte tekst haalt die 100 makkelijk en zou anders nooit
  # ge-OCR'd worden, terwijl juist de annotaties ontbreken.
  MIN_CHARS_PER_PAGE: "600"

  # Leesrichtingen waarin ge-OCR'd wordt (graden, spatie-gescheiden).
  # Elke richting = één extra render- en OCR-ronde, dus dit is de belangrijkste
  # knop voor de doorlooptijd. "0 90 270" dekt horizontale tekst plus beide
  # verticale leesrichtingen; voeg 180 toe als er ondersteboven tekst voorkomt,
  # of zet "0 90" als de tekst altijd maar één kant op gedraaid staat.
  OCR_ROTATIONS: "0 90 270"

  # Lengte van de langste zijde (pixels) waarop de pagina wordt gerasterd.
  # Bewust GEEN vaste dpi: 400 dpi op A0 geeft ~13000x18800 px, dat loopt vast.
  # 7000 px op A1 komt neer op ~300 dpi — genoeg voor kleine annotaties, en
  # onafhankelijk van het papierformaat. Verhoog als kleine tekst gemist wordt.
  OCR_LONG_EDGE: "7000"

  # Harde tijdslimiet (seconden) per losse render- of OCR-aanroep. Vangt de
  # pathologische tekening af die anders runner-tijd blijft opeten.
  OCR_TIMEOUT_SEC: "600"

  # Maximaal aantal pagina's dat per document ge-OCR'd wordt. Bouwtekeningen zijn
  # meestal 1–5 pagina's; deze rem voorkomt dat één dik bundeldocument de hele
  # run gijzelt.
  OCR_MAX_PAGES: "10"

  # Aantal PDF's dat tegelijk verwerkt wordt. Lager dan de 4 van de woo-workflow:
  # tesseract is CPU-gebonden en de runner heeft er maar een paar. Vier zware
  # OCR-processen naast elkaar maakt het geheel niet sneller, wel geheugenkrapper.
  PARALLEL_JOBS: "2"

  # ── PAGEFIND ───────────────────────────────────────────────────
  # Gepind i.p.v. @latest: een stille Pagefind-bump kan het zoekgedrag
  # veranderen (1.5 is bijv. metadata standaard gaan meenemen in de zoekindex).
  # De renovate-comment hieronder laat Renovate hier een PR voor openen.
  # renovate: datasource=npm depName=pagefind
  PAGEFIND_VERSION: "1.5.2"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          # poppler-utils      → pdftotext, pdfinfo, pdftoppm, pdffonts
          # qpdf               → pagina's roteren vóór het rasteren
          # tesseract-ocr      → OCR-engine (+ eng taalmodel)
          # tesseract-ocr-nld  → Nederlands taalmodel
          sudo apt-get install -y poppler-utils qpdf tesseract-ocr tesseract-ocr-nld
          # Versies loggen: de apt-packages zijn niet gepind, dus bij een
          # plotselinge kwaliteitsverandering wil je in de logs kunnen terugzien
          # welke tesseract er draaide.
          tesseract --version | head -1
          pdftoppm -v 2>&1 | head -1

      - name: Sync S3 → Markdown (scoped to folder)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BUCKET_NAME: publicaties-coevorden
        run: |
          set -euo pipefail
          mkdir -p "onderwerpen/$SYNC_FOLDER"

          echo "📥 S3 listing voor: $SYNC_FOLDER"
          # De AWS CLI pagineert list-objects-v2 zelf; geen handmatige token-loop
          # nodig. We projecteren key+etag direct als tab-gescheiden tekst.
          # 'None' = lege listing (JMESPath op een lege bucket) -> eruit filteren.
          aws s3api list-objects-v2 \
            --bucket "$BUCKET_NAME" \
            --prefix "$SYNC_FOLDER/" \
            --query "Contents[?ends_with(Key, '.pdf')].[Key, ETag]" \
            --output text > s3_raw.txt
          grep -v '^None' s3_raw.txt | tr -d '"' | sort -u > s3_map.txt || true

          # ── VEILIGHEIDSREM ──────────────────────────────────────────
          # Zonder PDF's zou Hugo een lege site bouwen en 'aws s3 sync --delete'
          # daarna de live-prefix leegvegen. Bij 0 treffers: hard stoppen.
          if [ ! -s s3_map.txt ]; then
            echo "❌ Geen PDF's onder '$SYNC_FOLDER/'. Klopt de prefix/casing?"
            echo "   Afgebroken vóór build/deploy om dataverlies te voorkomen."
            exit 1
          fi

          cut -f1 s3_map.txt | sort -u > s3_list.txt
          echo "📊 PDF count: $(wc -l < s3_list.txt)"

          echo "🧹 Opruimen verdwenen bestanden in onderwerpen/$SYNC_FOLDER"
          find "onderwerpen/$SYNC_FOLDER" -name "*.md" -print0 | while IFS= read -r -d '' md_path; do
            expected_pdf="${md_path#onderwerpen/}"
            expected_pdf="${expected_pdf%.md}.pdf"
            if ! grep -Fxq "$expected_pdf" s3_list.txt; then
              echo "❌ Verwijderen: $md_path (niet meer in S3)"
              rm "$md_path"
            fi
          done

          # ── OCR-HELPER ──────────────────────────────────────────────
          # Rastert het PDF en haalt tesseract er in elke geconfigureerde
          # leesrichting overheen. Schrijft het resultaat naar $2.
          # Faalt nooit hard: de aanroeper valt terug op de bestaande tekstlaag.
          ocr_pdf () {
            src="$1"; out="$2"; work="$3"
            : > "$out"

            for deg in $OCR_ROTATIONS; do
              rot="$work.rot$deg.pdf"

              if [ "$deg" = "0" ]; then
                cp "$src" "$rot"
              else
                # qpdf roteert de pagina's in het PDF zelf; pdftoppm rastert
                # daarna vanzelf in de gedraaide oriëntatie. Goedkoper en
                # betrouwbaarder dan het PNG achteraf willen draaien (waar we
                # ImageMagick voor zouden moeten installeren).
                qpdf --rotate="+$deg" -- "$src" "$rot" 2>/dev/null || continue
              fi

              # -gray: kleur voegt niets toe bij lijntekeningen en verviervoudigt
              #        het geheugengebruik.
              # -scale-to: schaalt de LANGSTE zijde; papierformaat-onafhankelijk.
              # -l: harde rem op het aantal pagina's.
              timeout "$OCR_TIMEOUT_SEC" pdftoppm \
                -png -gray \
                -scale-to "$OCR_LONG_EDGE" \
                -l "$OCR_MAX_PAGES" \
                "$rot" "$work.p$deg" 2>/dev/null || continue

              for png in "$work.p$deg"-*.png; do
                [ -e "$png" ] || continue
                # --psm 11 ("sparse text") i.p.v. de default, die uitgaat van een
                # doorlopende bladzijde tekst. Op een tekening staan losse labels
                # verspreid over het vel; met de default mist tesseract die.
                timeout "$OCR_TIMEOUT_SEC" tesseract "$png" - \
                  -l nld+eng \
                  --psm 11 \
                  -c preserve_interword_spaces=1 \
                  2>/dev/null >> "$out" || true
              done

              # Direct opruimen: bij A0 en meerdere richtingen lopen deze PNG's
              # anders makkelijk in de gigabytes op de runner.
              rm -f "$work.p$deg"-*.png "$rot"
            done

            [ -s "$out" ]
          }

          echo "➕ Verwerken PDF's..."
          process_file () {
            pdf_key="$1"; s3_etag="$2"
            md_path="onderwerpen/${pdf_key%.pdf}.md"

            if [ -f "$md_path" ]; then
              # Ongewijzigde ETag -> overslaan. Gewijzigd -> frontmatter vers
              # wegschrijven, zodat een eventuele enrich-stap 'm herpakt.
              stored=$(grep -m1 '^s3_etag:' "$md_path" 2>/dev/null \
                | sed 's/^s3_etag:[[:space:]]*//; s/^"//; s/"$//' || true)
              [ "$stored" = "$s3_etag" ] && return
              echo "♻️  Gewijzigd: $pdf_key"
            else
              echo "🆕 Nieuw: $pdf_key"
            fi

            mkdir -p "$(dirname "$md_path")"
            tmpfile=$(mktemp --suffix=.pdf)
            if aws s3 cp "s3://$BUCKET_NAME/$pdf_key" "$tmpfile" --quiet; then
              clean_title=$(basename "${pdf_key%.pdf}" | tr '"' "'")

              # maps[] = alle paddelen behalve de bestandsnaam (plaats/jaar/…).
              IFS='/' read -ra parts <<< "${pdf_key%.pdf}"
              taxo=()
              for ((i=0; i<${#parts[@]}-1; i++)); do taxo+=("\"${parts[$i]}\""); done
              taxonomy_list=$(IFS=,; echo "${taxo[*]}")

              # ── 1) Snelle route: bestaande tekstlaag ──────────────────
              txt="$tmpfile.txt"
              case "$PDFTOTEXT_MODE" in
                raw)    pdftotext -raw    "$tmpfile" "$txt" 2>/dev/null || : > "$txt" ;;
                layout) pdftotext -layout "$tmpfile" "$txt" 2>/dev/null || : > "$txt" ;;
                *)      pdftotext         "$tmpfile" "$txt" 2>/dev/null || : > "$txt" ;;
              esac

              # || true: een corrupte PDF laat pdfinfo falen, en met
              # 'set -euo pipefail' zou die assignment anders de hele run slopen —
              # precies bij het bestand waarvoor OCR juist bedoeld is.
              pages=$(pdfinfo "$tmpfile" 2>/dev/null | awk '/^Pages:/{print $2}' || true)
              pages=${pages:-1}
              chars=$(tr -d '[:space:]' < "$txt" | wc -c || true)
              chars=${chars:-0}
              ocr_used=false

              # ── 2) Te weinig tekst → rasteren en meerdere richtingen OCR'en ─
              if [ "$chars" -lt $(( pages * MIN_CHARS_PER_PAGE )) ]; then
                echo "🔍 OCR nodig: $pdf_key ($chars tekens / $pages pagina's)"
                ocr_raw="$tmpfile.ocr.txt"

                if ocr_pdf "$tmpfile" "$ocr_raw" "$tmpfile"; then
                  # Meerdere passes = veel overlap plus ruis uit de richtingen
                  # waarin een stuk tekst NIET stond. Opschonen:
                  #   • witruimte normaliseren
                  #   • regels korter dan 3 tekens weg (losse strepen, punten,
                  #     arceringsresten die tesseract als letter ziet)
                  #   • duplicaten weg, met behoud van volgorde
                  # De bestaande tekstlaag zetten we ervóór: het titelblok blijft
                  # zo bovenaan staan en is meestal de betrouwbaarste tekst.
                  {
                    cat "$txt"
                    printf '\n'
                    awk '{ gsub(/[[:space:]]+/, " "); sub(/^ /, ""); sub(/ $/, "") }
                         length($0) >= 3 && !seen[$0]++' "$ocr_raw"
                  } > "$txt.merged"
                  mv "$txt.merged" "$txt"
                  ocr_used=true
                  echo "✅ OCR klaar: $pdf_key ($(tr -d '[:space:]' < "$txt" | wc -c) tekens)"
                else
                  echo "⚠️  OCR leverde niets op: $pdf_key — verder met bestaande tekst"
                fi
              fi

              {
                printf -- "---\n"
                printf 'title: "%s"\n' "$clean_title"
                printf "maps: [%s]\n" "$taxonomy_list"
                printf 'source: "%s"\n' "$pdf_key"
                printf 's3_etag: "%s"\n' "$s3_etag"
                printf "ocr: %s\n" "$ocr_used"
                printf "date: %s\n" "$(date +%Y-%m-%d)"
                printf -- "---\n\n"
              } > "$md_path"

              tr -d '\000' < "$txt" >> "$md_path"
            fi
            # Ruimt zowel het PDF als alle afgeleiden ($tmpfile.txt, .ocr.txt,
            # eventuele achtergebleven .rotN.pdf/.pN-*.png) op.
            rm -f "$tmpfile" "$tmpfile".*
          }

          # Parallel, begrensd door PARALLEL_JOBS (OCR is CPU-gebonden).
          while IFS=$'\t' read -r pdf_key s3_etag; do
            [ -z "$pdf_key" ] && continue
            process_file "$pdf_key" "$s3_etag" &
            while [ "$(jobs -r | wc -l)" -ge "$PARALLEL_JOBS" ]; do wait -n; done
          done < s3_map.txt
          wait

      - name: Commit changes
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Sync: S3 folder ${{ env.SYNC_FOLDER }} naar Hugo"
          file_pattern: "onderwerpen/${{ env.SYNC_FOLDER }}/**"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pin voor reproduceerbare builds. Renovate pakt deze regel op via de
          # custom manager in renovate.json (comment + sleutel op de regel erna);
          # extractVersionTemplate daar strookt de 'v' van de release-tag eraf.
          # renovate: datasource=github-releases depName=gohugoio/hugo
          hugo-version: '0.165.0'
          extended: true

      - name: Build Hugo site
        run: |
          set -euo pipefail
          # Content GENEST neerzetten (content/bouwtekeningen/…), zodat:
          #   • .File.Path de prefix behoudt -> de PDF-fallback in single.html klopt
          #   • Hugo de prefix zelf in elke permalink zet
          # baseURL blijft daarom de CloudFront-root (géén prefix erin).
          rm -rf content && mkdir -p "content/$SYNC_FOLDER"
          cp -r "onderwerpen/$SYNC_FOLDER/." "content/$SYNC_FOLDER/"
          hugo --minify --baseURL "$CDN_BASE_URL/"

      - name: Index with Pagefind
        run: |
          # BELANGRIJK: --site op de ONDERWERPMAP, niet op public/.
          # Pagefind stelt de result-URL samen als: runtime-basis + opgeslagen URL.
          # De runtime-basis leidt Pagefind af uit de bundel-locatie
          # (/bouwtekeningen/_pagefind/ -> basis = /bouwtekeningen/).
          # Indexeren we op public/, dan zit die prefix óók al in de opgeslagen URL
          # en krijg je 'm dubbel. Door op de onderwerpmap te indexeren zijn de
          # opgeslagen URL's basis-relatief en vult de runtime-basis de prefix
          # precies één keer aan.
          npx "pagefind@$PAGEFIND_VERSION" --site "public/$SYNC_FOLDER" --output-subdir _pagefind

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_SITE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_SITE }}
          BUCKET_NAME: ${{ github.event_name == 'pull_request' && 'publicaties-coevorden-testsite' || 'publicaties-coevorden-site' }}
        run: |
          set -euo pipefail
          cp ./public/index.json "./public/$SYNC_FOLDER/recent.json"
          aws s3 sync ./public "s3://$BUCKET_NAME" \
            --delete \
            --exclude "*" \
            --include "$SYNC_FOLDER/*"
