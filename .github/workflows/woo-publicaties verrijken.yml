# =============================================================================
# woo-publicaties_verrijken.yml — GitHub Actions: AI-verrijking van de markdown
# =============================================================================
#
# WAT DOET DEZE WORKFLOW?
#   Draait scripts/woo-publicaties-verrijken.js: laat OpenAI per Woo-dossier een
#   samenvatting + tijdlijn genereren en commit die als frontmatter terug.
#
# CENTRALE CONFIG — DOC_PATH
#   DEZELFDE map als de deploy-workflow, gelezen uit ÉÉN repo-variabele
#   (SYNC_FOLDER) zodat casing/pad nooit uit elkaar lopen:
#     Repo → Settings → Secrets and variables → Actions → Variables →
#       Name:  SYNC_FOLDER   Value: woo-publicaties/2023
#   LET OP: de env hieronder heet DOC_PATH (NIET "PATH" — dat is een
#   systeemvariabele en breekt node/git/npm op de runner).
#
# EXTERNE ACTIONS / TOOLS
#   actions/checkout       → repo uitchecken.
#   actions/setup-node     → Node installeren (versie via '# renovate:'-comment).
#   npm-pakketten          → gray-matter openai glob fs-extra p-limit.
#
# SECRETS
#   OPENAI_API_KEY         → sleutel voor OpenAI.
#
# PR-GEDRAG
#   Op pull_request draait het script in DRY_RUN (geen writes, maar wél echte
#   OpenAI-calls zouden zonde zijn) — daarom staat DRY_RUN=1 op PR's, zodat er
#   niets wordt weggeschreven en de tokens niet verspild worden.
# =============================================================================

name: Woo publicaties verrijken
on:
 # pull_request:
  workflow_dispatch:

jobs:
  woo-publicaties-verrijken:
    runs-on: ubuntu-latest

    env:
      # Zelfde map als deploy.yml, uit de gedeelde repo-variabele.
      DOC_PATH: ${{ vars.SYNC_FOLDER || 'woo-publicaties/2025' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # renovate: datasource=node-version depName=node
          node-version: 24

      - name: Install dependencies
        run: npm install gray-matter openai glob fs-extra p-limit

      - name: Run enrichment script
        run: node scripts/woo-publicaties-verrijken.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOC_PATH: ${{ env.DOC_PATH }}
          # Op PR's niets wegschrijven én geen tokens verspillen.
          DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '0' }}

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@users.noreply.github.com"
          # Alleen de verrijkte map committen (zelfde scope als DOC_PATH)
          git add "onderwerpen/${DOC_PATH}"
          git commit -m "chore: enrich markdown with AI metadata (${DOC_PATH})" || exit 0
          git push
