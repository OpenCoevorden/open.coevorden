# =============================================================================
# woo-publicaties_verrijken.yml — GitHub Actions: AI-verrijking van de markdown
# =============================================================================
#
# WAT DOET DEZE WORKFLOW?
#   Draait het script scripts/woo-publicaties-verrijken.js dat per Woo-dossier
#   een samenvatting + tijdlijn door OpenAI laat genereren en als frontmatter
#   terugcommit. Handmatig te starten (workflow_dispatch).
#
# EXTERNE ACTIONS / TOOLS (updaten = versienummer hieronder in de steps aanpassen)
#   actions/checkout@v4      → repo uitchecken.
#   actions/setup-node@v4    → Node installeren (node-version hieronder: 20).
#   npm-pakketten            → gray-matter openai glob fs-extra p-limit
#                              (geïnstalleerd in de step "Install dependencies";
#                               updaten: pas die npm install-regel aan).
#
# SECRETS (in te stellen onder Repo → Settings → Secrets and variables → Actions)
#   OPENAI_API_KEY           → sleutel voor OpenAI. Updaten: roteer in Secrets.
#
# CONFIGURATIE (env, hieronder onder jobs.<job>.env)
#   DOC_PATH                 → welke map ("<onderwerp>/<jaar>") verrijkt wordt.
#                              MOET exact dezelfde casing hebben als SYNC_FOLDER
#                              in woo-publicaties_deploy.yml. Updaten: wijzig de
#                              waarde hieronder. NIET "PATH" noemen (systeemvar.).
# =============================================================================

name: Woo publicaties verrijken
on:
  workflow_dispatch:

jobs:
  woo-publicaties-verrijken:
    runs-on: ubuntu-latest

    env:
      # Pad-fragment onder onderwerpen/ dat verrijkt moet worden.
      # Vorm: "<onderwerp>/<jaar>". Zelfde casing als in deploy.yml
      # (Woo-publicaties met hoofdletter W), anders vindt de glob niks.
      # LET OP: NIET "PATH" noemen — dat is een systeemvariabele en breekt
      # het vinden van node/git/npm op de runner.
      DOC_PATH: "woo-publicaties/2023"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install gray-matter openai glob fs-extra p-limit

      - name: Run enrichment script
        run: node scripts/woo-publicaties-verrijken.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOC_PATH: ${{ env.DOC_PATH }}

      - name: Commit changes
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@users.noreply.github.com"
          # Alleen de verrijkte map committen (zelfde scope als DOC_PATH)
          git add "onderwerpen/${DOC_PATH}"/**/*.md
          git commit -m "chore: enrich markdown with AI metadata (${DOC_PATH})" || exit 0
          git push
