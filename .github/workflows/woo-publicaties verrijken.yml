name: Woo publicaties verrijken
on:
  workflow_dispatch:

jobs:
  woo-publicaties-verrijken:
    runs-on: ubuntu-latest

    env:
      # Pad-fragment onder onderwerpen/ dat verrijkt moet worden.
      # Vorm: "<onderwerp>/<jaar>". Zelfde casing als in deploy.yml
      # (Woo-publicaties met hoofdletter W), anders vindt de glob niks.
      # LET OP: NIET "PATH" noemen — dat is een systeemvariabele en breekt
      # het vinden van node/git/npm op de runner.
      DOC_PATH: "woo-publicaties/2023"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install gray-matter openai glob fs-extra p-limit

      - name: Run enrichment script
        run: node scripts/woo-publicaties-verrijken.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOC_PATH: ${{ env.DOC_PATH }}

      - name: Commit changes
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@users.noreply.github.com"
          # Alleen de verrijkte map committen (zelfde scope als DOC_PATH)
          git add "onderwerpen/${DOC_PATH}"/**/*.md
          git commit -m "chore: enrich markdown with AI metadata (${DOC_PATH})" || exit 0
          git push
