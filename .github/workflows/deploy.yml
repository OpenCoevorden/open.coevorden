name: s3 pdf documenten ophalen en website bouwen
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  # ── PAS HIER HET ONDERWERP + JAAR AAN ──────────────────────────
  # Vorm: "<onderwerp>/<jaar>", bijv. "Woo-publicaties/2023".
  # Dit is de eenheid voor syncen, bouwen én opruimen. De bron-bucket
  # is leidend: dit pad moet exact als prefix in de bron-bucket bestaan.
  # De site-bucket wordt hiervan een 1-op-1 spiegel.
  #
  # LET OP casing: S3, CloudFront en de Pagefind-paden zijn
  # hoofdlettergevoelig. Gebruik EXACT dezelfde schrijfwijze
  # ("Woo-publicaties" met hoofdletter W) overal — ook in index.html
  # (BASE_PATH) en in de bron-bucket — anders krijg je 404's.
  #
  # Per onderwerp een eigen kopie van deze workflow (deploy-woo.yml,
  # deploy-raadsstukken.yml, ...) met alleen deze regel anders.
  SYNC_FOLDER: "woo-publicaties/2026"
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils jq

      - name: Sync S3 → Markdown (Scoped to Folder)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BUCKET_NAME: publicaties-coevorden
        run: |
          set -euo pipefail
          # Repo-opslag voor de gegenereerde .md-bestanden. Heet nu "onderwerpen/"
          # i.p.v. het oude "docs/" — puur een betekenisvollere naam. Hier leest
          # de volgende run de ETags uit terug voor change-detectie.
          mkdir -p "onderwerpen/$SYNC_FOLDER"

          echo "📥 S3 listing voor map: $SYNC_FOLDER..."

          # s3_map.txt bevat per PDF twee kolommen (tab-gescheiden): key <TAB> etag
          > s3_map.txt
          TOKEN=""

          while : ; do
            if [ -z "$TOKEN" ]; then
              RESPONSE=$(aws s3api list-objects-v2 \
                --bucket "$BUCKET_NAME" \
                --prefix "$SYNC_FOLDER/" \
                --max-items 1000)
            else
              RESPONSE=$(aws s3api list-objects-v2 \
                --bucket "$BUCKET_NAME" \
                --prefix "$SYNC_FOLDER/" \
                --starting-token "$TOKEN" \
                --max-items 1000)
            fi

            # Alleen PDF's ophalen, mét de ETag (content-hash) uit dezelfde listing.
            # De omringende quotes van de ETag strippen we direct met gsub.
            echo "$RESPONSE" \
              | jq -r '.Contents[]? | select(.Key | endswith(".pdf")) | "\(.Key)\t\(.ETag | gsub("\""; ""))"' \
              >> s3_map.txt || true
            TOKEN=$(echo "$RESPONSE" | jq -r '.NextToken // empty')
            [ -z "$TOKEN" ] && break
          done

          sort -u s3_map.txt -o s3_map.txt

          # Alleen-keys lijst afleiden voor de cleanup (blijft ongewijzigd werken).
          cut -f1 s3_map.txt | sort -u > s3_list.txt

          echo "📊 PDF count in $SYNC_FOLDER: $(wc -l < s3_list.txt)"

          echo "🧹 Cleanup removed files in onderwerpen/$SYNC_FOLDER..."
          # We zoeken ALLEEN in de specifieke submap om andere mappen te ontzien
          if [ -d "onderwerpen/$SYNC_FOLDER" ]; then
            find "onderwerpen/$SYNC_FOLDER" -name "*.md" -print0 | while IFS= read -r -d '' md_path; do
              # Bepaal de relatieve S3 key op basis van het md pad
              # bijv: onderwerpen/coevorden/test.md -> coevorden/test.pdf
              relative_to_docs="${md_path#onderwerpen/}"
              expected_pdf="${relative_to_docs%.md}.pdf"

              if ! grep -Fxq "$expected_pdf" s3_list.txt; then
                echo "❌ Removing: $md_path (niet meer in S3)"
                rm "$md_path"
              fi
            done
          fi

          echo "➕ Processing PDFs..."

          process_file () {
            pdf_key="$1"
            s3_etag="$2"
            # md_path wordt bijv: onderwerpen/coevorden/sub/bestand.md
            md_path="onderwerpen/${pdf_key%.pdf}.md"

            if [ -f "$md_path" ]; then
              # Vergelijk de opgeslagen ETag met die uit de S3-listing.
              # Gelijk  -> onveranderd, overslaan.
              # Anders  -> PDF is vervangen, opnieuw verwerken (frontmatter wordt
              #            vers weggeschreven zonder ai_status, zodat enrich.js
              #            de AI-verrijking opnieuw oppakt).
              stored=$(grep -m1 '^s3_etag:' "$md_path" 2>/dev/null \
                | sed 's/^s3_etag:[[:space:]]*//; s/^"//; s/"$//' || true)
              if [ "$stored" = "$s3_etag" ]; then
                return
              fi
              echo "♻️  Gewijzigd, opnieuw verwerken: $pdf_key"
            else
              echo "🆕 Processing: $pdf_key"
            fi

            mkdir -p "$(dirname "$md_path")"
            tmpfile=$(mktemp --suffix=.pdf)

            if aws s3 cp "s3://$BUCKET_NAME/$pdf_key" "$tmpfile" --quiet; then
              filename=$(basename "${pdf_key%.pdf}")
              clean_title=$(echo "$filename" | tr '"' "'")

              # Taxonomy opbouw
              relative_path="${pdf_key%.pdf}"
              IFS='/' read -ra parts <<< "$relative_path"
              taxo=()
              for ((i=0; i<${#parts[@]}-1; i++)); do
                taxo+=("\"${parts[$i]}\"")
              done
              taxonomy_list=$(IFS=,; echo "${taxo[*]}")

              {
                printf -- "---\n"
                printf "title: \"%s\"\n" "$clean_title"
                printf "maps: [%s]\n" "$taxonomy_list"
                printf "source: \"%s\"\n" "$pdf_key"
                printf "s3_etag: \"%s\"\n" "$s3_etag"
                printf "date: %s\n" "$(date +%Y-%m-%d)"
                printf -- "---\n\n"
              } > "$md_path"

              pdftotext -raw "$tmpfile" - | tr -d '\000' >> "$md_path"
            fi
            rm -f "$tmpfile"
          }

          # Verwerk parallel (max 4 tegelijk) in dezelfde shell, zodat we per
          # regel zowel de key als de etag kunnen doorgeven. Geen 'export -f'
          # of 'bash -c'-subshells meer nodig.
          max_jobs=4
          while IFS=$'\t' read -r pdf_key s3_etag; do
            [ -z "$pdf_key" ] && continue
            process_file "$pdf_key" "$s3_etag" &
            while [ "$(jobs -r | wc -l)" -ge "$max_jobs" ]; do
              wait -n
            done
          done < s3_map.txt
          wait

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync: S3 folder ${{ env.SYNC_FOLDER }} naar Hugo"
          # Alleen wijzigingen in de specifieke map committen
          file_pattern: "onderwerpen/${{ env.SYNC_FOLDER }}/**"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v2

      - name: Build Hugo site
        run: |
          # De .md-bestanden leven in onderwerpen/ (repo-opslag). We kopiëren ze
          # naar content/ ZONDER extra tussenlaag, zodat de Hugo-sectie het
          # onderwerp wordt (content/Woo-publicaties/2023/... -> sectie
          # "Woo-publicaties") en de site-URL de bron exact spiegelt:
          #   bron : Woo-publicaties/2023/Woo-verzoeken/doc.pdf
          #   site : .../Woo-publicaties/2023/Woo-verzoeken/doc.html
          mkdir -p "content/$SYNC_FOLDER"
          cp -r "onderwerpen/$SYNC_FOLDER/." "content/$SYNC_FOLDER/" 2>/dev/null || true
          hugo --minify --baseURL "https://publicaties-coevorden-site.s3.eu-north-1.amazonaws.com/$SYNC_FOLDER/"

      - name: Index with Pagefind
        run: npx pagefind@latest --site public --output-subdir _pagefind

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_SITE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_SITE }}
          BUCKET_NAME: publicaties-coevorden-site
        run: |
          # Sync de output naar de submap in de S3 bucket
          # --delete zorgt dat bestanden die lokaal weg zijn, ook in die S3 submap verdwijnen
          aws s3 sync ./public "s3://$BUCKET_NAME/$SYNC_FOLDER" \
            --delete
